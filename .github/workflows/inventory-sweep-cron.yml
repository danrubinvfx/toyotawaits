name: Scheduled 12-Hour Alert Dispatcher

on:
  schedule:
    - cron: '30 14 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: inventory-sweep-cron
  cancel-in-progress: false

jobs:
  trigger-sweep:
    name: Trigger Remote Inventory Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Remote Inventory Sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET is empty in GitHub Actions secrets!"
            exit 1
          fi

          TARGET_URL="https://www.toyotawaits.ca/api/cron/check-alerts"
          echo "Triggering $TARGET_URL..."

          HTTP_STATUS=$(curl -s -o /tmp/cron_response.json -w "%{http_code}" -X POST "$TARGET_URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          echo "HTTP Status Code: $HTTP_STATUS"
          cat /tmp/cron_response.json || true
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Sweep trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Sweep completed successfully."
