name: Scheduled 6-Hour Inventory Sweep

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: inventory-sweep-cron
  cancel-in-progress: false

jobs:
  trigger-sweep:
    name: Trigger Remote Inventory Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Remote Inventory Sweep
        run: |
          TARGET_URL="https://www.toyotawaits.ca/api/cron/check-alerts"
          echo "Triggering $TARGET_URL..."
          HTTP_STATUS=$(curl -s -o /tmp/cron_response.json -w "%{http_code}" -X POST "$TARGET_URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "HTTP Status Code: $HTTP_STATUS"
          cat /tmp/cron_response.json || true
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Sweep trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Sweep completed successfully."
