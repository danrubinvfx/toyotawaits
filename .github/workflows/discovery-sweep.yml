name: "Discovery / Scheduled Multi-Dealer Sweep"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dealer:
        description: 'Specific dealer ID to sweep (leave empty for --all)'
        required: false
        default: 'all'

concurrency:
  group: discovery-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    name: "Sweep Dealer Lots & Refresh Active Inventory"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Discovery Sweep
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POLITE_DEALER_COOLDOWN_MS: 4000
        run: |
          if [ "${{ github.event.inputs.dealer }}" != "" ] && [ "${{ github.event.inputs.dealer }}" != "all" ]; then
            echo "Running sweep for dealer: ${{ github.event.inputs.dealer }}"
            npx tsx scripts/discovery/sweep-dealer.ts --dealer=${{ github.event.inputs.dealer }}
          else
            echo "Running sweep across all registered pilot dealerships..."
            npx tsx scripts/discovery/sweep-dealer.ts --all
          fi
