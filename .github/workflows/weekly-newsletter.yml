name: Weekly Pipeline Brief Newsletter

on:
  schedule:
    # Mondays at 8:00 AM PST / 16:00 UTC
    - cron: '0 16 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without sending live emails'
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-newsletter-dispatch
  cancel-in-progress: false

jobs:
  send-weekly-brief:
    name: Send Weekly Pipeline Brief via Resend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dispatch Weekly Pipeline Brief
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: npx tsx scripts/send-weekly-newsletter.ts
