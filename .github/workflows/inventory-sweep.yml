name: Automated Dealer Inventory Sweep

on:
  schedule:
    # Daily at 10:00 UTC (~2:00 AM PST / 3:00 AM PDT off-peak window)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dealer:
        description: 'Target dealer code to sweep ("all", "jptoyota-downtown", "jptoyota-surrey", "westcoast-toyota")'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Dry run (validate network & parser without writing to Supabase)'
        required: false
        default: false
        type: boolean

concurrency:
  group: inventory-sweep
  cancel-in-progress: false

jobs:
  sweep-inventory:
    name: Polite Dealer Inventory Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Polite Inventory Sweep
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SKIPPED: SUPABASE_SERVICE_ROLE_KEY not configured in GitHub Secrets"
            exit 0
          fi
          DEALER="${{ inputs.dealer || 'all' }}"
          if [ "$DEALER" = "all" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              npm run sweep:all -- --dry-run
            else
              npm run sweep:all
            fi
          else
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              npm run sweep:dealer -- --dealer="$DEALER" --dry-run
            else
              npm run sweep:dealer -- --dealer="$DEALER"
            fi
          fi
